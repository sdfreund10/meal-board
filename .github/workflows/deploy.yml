name: Deploy API

on:
  push:
    # branches: [main]
    # paths:
    #   - 'backend/**'
    #   - 'deploy/**'
    #   - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen && uv run pytest -q

  deploy:
    needs: [test]
    # if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only
            cd backend
            uv sync --no-dev
            uv run alembic upgrade head
            sudo systemctl restart mealboard-api

      - name: Smoke test health endpoint
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsS "https://${HEALTH_CHECK_HOST}/health" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed after deploy"
          exit 1
        env:
          HEALTH_CHECK_HOST: ${{ secrets.HEALTH_CHECK_HOST }}
